name: Android smoke test

# Boots the app in an emulator and reports its log: a start-up crash shows up as an annotation.
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: never
  NDK_VERSION: "26.3.11579264"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
          targets: x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-x86_64-${{ hashFiles('android/scripts/vendor-winit.sh', 'android/patches/*.patch') }}
          cache-all-crates: true
          cache-on-failure: true
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 ndk;${{ env.NDK_VERSION }}"
      - run: echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build (x86_64 library, debug-signed APK)
        run: |
          chmod +x android/scripts/build.sh
          android/scripts/build.sh --no-apk --abi x86_64
          cd android && gradle assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Run in emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash android/scripts/smoke.sh
      - name: Report
        if: always()
        run: |
          MSG=$( (cat pid.txt; echo ---app; grep -v "AppsFilter\|nativeloader" app.log | tail -25; echo ---crash; grep -E "DEBUG|F/libc|Fatal signal|SIGSEGV|SIGABRT|backtrace|Abort message|AndroidRuntime|panicked|RustStdoutStderr|died" smoke.log | tail -90) | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Emulator log::$MSG"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke
          path: |
            smoke.log
            smoke.png
